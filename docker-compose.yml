version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: universal-listener-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: listener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: universal_listener
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
