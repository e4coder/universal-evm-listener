version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: universal-listener-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: erc20cache
      POSTGRES_PASSWORD: erc20cache_pass
      POSTGRES_DB: erc20cache
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
